[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyttitools-core"
version = "2.0.0a0"
description = "PyTTI: CLIP-guided image synthesis and animation (Limited Palette / VQGAN)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "scipy>=1.9",
    "attrs>=22.2",
    "requests>=2.28",
    "kornia>=0.6.11",
    "einops>=0.6",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "loguru>=0.6",
    "Pillow>=9.4",
    "imageio>=2.27",
    "imageio-ffmpeg>=0.4.8",
    "tqdm>=4.62",
    "ftfy>=6.1",
    "regex",
    "clip @ git+https://github.com/openai/CLIP.git",
]

[project.urls]
Homepage = "https://github.com/pytti-tools/pytti-core"

[project.scripts]
pytti = "pytti.workhorse:_main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pyright>=1.1.380",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # pycodestyle errors
    "F",              # pyflakes (undefined names, unused imports)
    "I",              # import sorting
    "B",              # bugbear (mutable defaults, call-in-default-argument)
    "UP",             # pyupgrade
    "RUF100",         # unused noqa
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU",
    "download: downloads large model checkpoints",
]
