[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyttitools-core"
version = "2.0.0a0"
description = "PyTTI: CLIP-guided image synthesis and animation (Limited Palette / VQGAN)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "scipy>=1.9",
    "attrs>=22.2",
    "requests>=2.28",
    "kornia>=0.6.11",
    "einops>=0.6",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "loguru>=0.6",
    "Pillow>=9.4",
    "imageio>=2.27",
    "imageio-ffmpeg>=0.4.8",
    "tqdm>=4.62",
    "ftfy>=6.1",
    "regex",
    # perceptors: open_clip loads the same OpenAI weights from HF hub
    # (bit-comparability vs the retired openai/CLIP package: ~6e-6)
    "open-clip-torch>=2.32",
    "timm>=1.0.15",
    "schedulefree>=1.4.1",
    # SigLIP2 tokenizer (open_clip's HFTokenizer imports it lazily)
    "transformers>=5",
    # revision-pinned checkpoint downloads (LlamaGen VQ, MLX tower weights)
    "huggingface_hub>=0.20",
    # MLX perceptor backend (docs/mlx-port-plan.md) — imported lazily inside
    # pytti.Perceptor.mlx_backend only, so linux never touches it
    "mlx>=0.32; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# 3D animation (AdaBins monocular depth)
threed = [
    "pyttitools-adabins @ git+https://github.com/pytti-tools/AdaBins.git",
    "gdown",  # adabins imports it but does not declare it
]
# Video Source animation + flow stabilization (GMA optical flow)
video = ["pyttitools-gma @ git+https://github.com/pytti-tools/GMA.git"]
animation = [
    "pyttitools-adabins @ git+https://github.com/pytti-tools/AdaBins.git",
    "gdown",  # adabins imports it but does not declare it
    "pyttitools-gma @ git+https://github.com/pytti-tools/GMA.git",
]

[project.urls]
Homepage = "https://github.com/pytti-tools/pytti-core"

[project.scripts]
pytti = "pytti.workhorse:_main"

[dependency-groups]
dev = [
    "pytest>=8",
    "lpips>=0.1.4",
    "ruff~=0.16.0",  # pinned: lint verdicts must match between local and CI
    "pyright>=1.1.380",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
# vendored third-party code stays verbatim-diffable against its upstream
extend-exclude = ["src/pytti/vendor"]

[tool.ruff.lint.isort]
# pytti is installed editable in CI, which would otherwise flip its import
# grouping to third-party and make lint verdicts disagree with local
known-first-party = ["pytti"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # pycodestyle errors
    "F",              # pyflakes (undefined names, unused imports)
    "I",              # import sorting
    "B",              # bugbear (mutable defaults, call-in-default-argument)
    "UP",             # pyupgrade
    "RUF100",         # unused noqa
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA GPU",
    "download: downloads large model checkpoints",
    "extras: requires the optional adabins/gma extras",
]
addopts = "-m 'not gpu and not download and not extras'"
