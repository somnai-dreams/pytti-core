# Every setting, its type, and its default lives in the schema:
#   src/pytti/config/structured_config.py  (ConfigSchema)
# Override values here, or in a conf/*.yaml preset selected with conf=<name>.
# Unknown keys and invalid values fail at startup, on purpose.

defaults:
  - config_schema
  - _self_
  - conf: _empty

hydra:
  job:
    # run inside outputs/<date>/<time>/ so each run's images_out is isolated
    chdir: true

config_version: 2

# the one thing every run must provide
scenes: ???
